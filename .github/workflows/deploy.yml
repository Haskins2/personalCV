name: Deploy

# Only run on pushes to main branch
on:
  push:
    branches: [main]

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Run all CI checks first
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  # Deploy to Linode server
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci]
    # Only deploy if CI passed and we're on main branch
    if: github.ref == 'refs/heads/main' && needs.ci.result == 'success'

    environment:
      name: production
      url: https://stephenhaskins.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          mkdir -p deploy_temp

          # Runtime files only — next start does not need src or Tailwind/TS configs
          cp -r .next deploy_temp/
          cp -r public deploy_temp/
          cp package.json deploy_temp/
          cp package-lock.json deploy_temp/
          cp next.config.js deploy_temp/

          # Create tar archive
          tar -czf deploy.tar.gz -C deploy_temp .

          echo "Package created: $(ls -lh deploy.tar.gz | awk '{print $5}')"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add server to known hosts to avoid prompt
          ssh-keyscan -H ${{ secrets.LINODE_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload package to server
        run: |
          echo "Uploading deployment package to server..."
          scp -i ~/.ssh/deploy_key deploy.tar.gz \
            ${{ secrets.LINODE_SSH_USER }}@${{ secrets.LINODE_SSH_HOST }}:~/personalCV/

      - name: Deploy on server
        run: |
          echo "Deploying application on server..."
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.LINODE_SSH_USER }}@${{ secrets.LINODE_SSH_HOST }} << 'EOF'
          set -e

          cd ~/personalCV

          rollback() {
            echo "=== Rolling back to previous build ==="
            LATEST_BACKUP=$(ls -dt .next.backup.* 2>/dev/null | head -n 1 || true)
            if [ -z "$LATEST_BACKUP" ]; then
              echo "ERROR: No backup available to restore"
              return 1
            fi

            pm2 stop personalCV || true
            pm2 delete personalCV || true
            rm -rf .next
            mv "$LATEST_BACKUP" .next
            pm2 start npm --name "personalCV" -- start
            pm2 save
            echo "Rollback restored: $LATEST_BACKUP"
          }

          echo "=== Preparing release (app stays up) ==="
          rm -rf .release
          mkdir -p .release
          tar -xzf deploy.tar.gz -C .release
          (cd .release && npm ci --omit=dev)

          echo "=== Stopping current PM2 processes ==="
          pm2 stop personalCV || true
          pm2 delete personalCV || true
          pm2 stop personal-cv || true
          pm2 delete personal-cv || true

          echo "=== Backing up current build ==="
          if [ -d ".next" ]; then
            BACKUP_NAME=".next.backup.$(date +%Y%m%d_%H%M%S)"
            mv .next "$BACKUP_NAME"
            echo "Backup created: $BACKUP_NAME"
          fi

          echo "=== Swapping in new release ==="
          mv .release/.next .next
          rm -rf public
          mv .release/public public
          rm -rf node_modules
          mv .release/node_modules node_modules
          cp .release/package.json package.json
          cp .release/package-lock.json package-lock.json
          cp .release/next.config.js next.config.js
          rm -rf .release
          rm -f deploy.tar.gz

          echo "=== Starting application ==="
          if ! pm2 start npm --name "personalCV" -- start; then
            echo "ERROR: PM2 failed to start"
            rollback
            exit 1
          fi
          pm2 save

          echo "=== Verifying deployment ==="
          sleep 5
          APP_PID=$(pm2 pid personalCV 2>/dev/null || true)
          if [ -n "$APP_PID" ] && [ "$APP_PID" != "0" ] && pm2 show personalCV 2>/dev/null | grep -i status | grep -qi online; then
            pm2 show personalCV
            echo "Application is online (pid $APP_PID)!"
          else
            echo "ERROR: Application is not online"
            pm2 show personalCV || true
            rollback
            exit 1
          fi

          # Keep only the 3 most recent backups
          ls -dt .next.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          echo "=== Deployment complete! ==="
          EOF

      - name: Health check
        id: health
        run: |
          echo "Waiting for server to be ready..."
          sleep 10

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://stephenhaskins.com/ || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed! Public site returned HTTP $HTTP_STATUS"
          else
            echo "Health check failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Rollback on failed health check
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "Health check failed — rolling back on server..."
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.LINODE_SSH_USER }}@${{ secrets.LINODE_SSH_HOST }} << 'EOF'
          set -e
          cd ~/personalCV

          LATEST_BACKUP=$(ls -dt .next.backup.* 2>/dev/null | head -n 1 || true)
          if [ -z "$LATEST_BACKUP" ]; then
            echo "ERROR: No backup available to restore"
            exit 1
          fi

          pm2 stop personalCV || true
          pm2 delete personalCV || true
          rm -rf .next
          mv "$LATEST_BACKUP" .next
          pm2 start npm --name "personalCV" -- start
          pm2 save
          echo "Rollback restored: $LATEST_BACKUP"
          EOF
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        run: |
          echo "============================================"
          echo "Deployment completed successfully!"
          echo "============================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
